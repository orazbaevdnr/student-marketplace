spring:
  application:
    name: student-marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false            # no lazy loading in controllers: every query is planned in the service layer
    hibernate:
      ddl-auto: none               # the schema belongs to Flyway (db/migration)
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      accept-float-as-int: false   # price 12.5 is rejected instead of silently becoming 12
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

server:
  # Render/Railway/Heroku inject PORT; plain servers keep 8080.
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # correct absolute image URLs behind a reverse proxy
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  zone: Asia/Almaty
  # Only e-mails of this domain can register. Leave empty to allow any e-mail.
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
  jwt:
    secret: ${JWT_SECRET:dev-local-secret-change-in-production-!!}          # at least 32 characters, required
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  storage:
    dir: ${PHOTO_DIR:./data/photos}
    max-photos-per-listing: 5
  stale:
    remind-after-days: 30
    hide-after-days: 37
    cron: "0 0 3 * * *"
  admin:
    email: ${ADMIN_EMAIL:admin@kbtu.kz}
    password: ${ADMIN_PASSWORD:Admin12345!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    # Login/register attempts allowed per client IP per minute (in-memory, per instance).
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
