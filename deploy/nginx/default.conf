# Frontend (SPA) + reverse proxy for the Spring Boot API.
# The browser only ever talks to this server: /api/ goes to the backend, everything else
# is the React app. The backend and PostgreSQL stay on the internal Docker network.

# Defense in depth: the backend also has its own limiter for /api/auth/login|register.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;      # matches spring.servlet.multipart.max-request-size
    limit_req_status 429;         # nginx defaults to 503, 429 is the correct code
    limit_conn_status 429;

    # ---- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;   # Firebase popup login
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; manifest-src 'self'; worker-src 'self' blob:" always;

    # ---- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---- health probe used by the container HEALTHCHECK --------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- password endpoints: strict limit ---------------------------------
    # Regex locations win over the /api/ prefix below.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # ---- API --------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 30;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Uploaded photos are served by the backend as /api/client/photos/... (covered above).

    # Backend developer endpoints must never be reachable from the internet.
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        return 404;
    }

    # ---- static assets: long cache ----------------------------------------
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise users keep an old bundle.
    location = /index.html {
        expires -1;
    }

    # ---- SPA fallback -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.env, .git, ...), but keep ACME HTTP-01 challenges working.
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
