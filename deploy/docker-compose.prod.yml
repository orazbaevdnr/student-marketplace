# Production stack for the Student Marketplace.
#
#   cd deploy
#   copy .env.prod.example .env.prod     # then fill in the secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Only the frontend container publishes ports. PostgreSQL and the backend are reachable
# only from the internal Docker network.
#
# The frontend build context is the repository root (one level up), because the
# Dockerfile needs package.json, src/, index.html and vite.config.ts.
# The backend is the sibling directory ../../student-marketplace.

name: student-marketplace

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USER:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketplace} -d ${DB_NAME:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ../../student-marketplace
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod (32+ characters)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-kbtu.kz}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PHOTO_DIR: /data/photos
      TZ: Asia/Almaty
    volumes:
      - photos:/data/photos
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/client
        VITE_BASE_PATH: /
        VITE_USE_MOCK: "false"
        VITE_ENABLE_DEMO_LOGIN: "false"
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # Daily PostgreSQL dump, kept for BACKUP_KEEP_DAYS days.
  # Photo files: run scripts/backup-photos.sh from the backend repository (see DEPLOYMENT.md).
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USER:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: Asia/Almaty
    volumes:
      - ./backups/db:/backups
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  photos:
